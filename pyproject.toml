[project]
name = "partial-python"
version = "0.1.0a1"
description = "Append-only Python parsing and incremental execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "ruff>=0.9",
    "build>=1",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/partial_python"]
