[project]
name = "partial-python"
version = "0.1.0a1"
description = "Append-only Python parsing and incremental execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/promplate/partial-python"
Documentation = "https://github.com/promplate/partial-python/blob/main/docs/api.md"

[build-system]
requires = ["uv_build>=0.7.19,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "ruff~=0.17.3",
    "basedpyright>=1.40.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
# Keep extensions disjoint from Ruff 0.17 defaults; recheck when upgrading.
extend-select = [
    "UP013", "UP015", "UP042",
    "W191", "W291", "W292", "W293",
    "FURB110", "FURB116", "FURB164", "FURB171", "FURB187",
    "C416", "C420",
    "ISC001", "ISC002", "ISC003",
    "PTH100", "PTH101", "PTH102", "PTH103", "PTH104", "PTH105", "PTH106", "PTH107", "PTH108", "PTH109", "PTH110", "PTH111", "PTH112", "PTH113", "PTH114", "PTH115", "PTH116",
    "PTH117", "PTH118", "PTH119", "PTH120", "PTH121", "PTH122", "PTH123", "PTH201", "PTH202", "PTH203", "PTH204", "PTH205", "PTH206", "PTH207", "PTH208", "PTH211",
    "RSE102",
]

[tool.pyright]
include = ["src/partial_python"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"
